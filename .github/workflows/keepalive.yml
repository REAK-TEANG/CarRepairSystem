name: Keep API awake
# Render's free plan sleeps after ~15 minutes without traffic, making the next
# request take ~60s. A ping every 10 minutes prevents that. Remove this workflow
# if you move to a paid plan.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://carrepair-backend.onrender.com/api/health
