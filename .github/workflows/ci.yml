name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CarRepairShop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CarRepairShop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:csp
      - name: Dependency audit (shipped code, high severity and above)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3" # same as the production Docker image
          tools: composer
      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --working-dir=api
      - name: Dependency audit
        run: composer audit --no-dev --working-dir=api
      - name: PHP syntax check
        run: find api -name '*.php' -not -path 'api/vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: bash scripts/test-api.sh
