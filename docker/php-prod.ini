; Production PHP settings (copied into the image by the Dockerfile)
expose_php = 0
display_errors = 0
log_errors = 1

; Compiled-code cache: code never changes inside a running container
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

; Shared in-memory cache (rate limiter, token blacklist, permissions matrix)
apc.enabled = 1
apc.shm_size = 32M
